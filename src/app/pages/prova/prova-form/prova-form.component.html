<p-toast/>
<p-confirmDialog/>
<p-panel header="Gerar Provas" class="text-center sm:text-left">
  <form [formGroup]="form" class="box " enctype="multipart/form-data">
    <div style="display: flex; justify-content: space-between;">
      <div class="flex w-1/4 flex-col text-xs" style="display:flex">
        <label class="mb-1"> Total de Perguntas:</label>
        <p-inputNumber
          formControlName="totalQuestoes"
          class="inline-grid"
          locale="pt-BR"/>
        <p class="text-red-700 text-sm"
           *ngIf="form.get('totalQuestoes')?.touched && form.get('totalQuestoes')?.hasError('required')">
          O campo Total de Perguntas é obrigatório.
        </p>
      </div>

      <div class="flex w-1/4 flex-col text-xs ml-2">
        <label class="mb-1">Fáceis:</label>
        <p-inputNumber
          formControlName="facil"
          class="inline-grid"
          locale="pt-BR"/>
        <p class="text-red-700 text-sm"
           *ngIf="form.get('facil')?.touched && form.get('facil')?.hasError('required')">
          O campo de perguntas fáceis é obrigatório.
        </p>
      </div>

      <div class="flex w-1/4 flex-col text-xs ml-2">
        <label class="mb-1">Médias:</label>
        <p-inputNumber
          formControlName="medio"
          class="inline-grid"
          locale="pt-BR"/>
        <p class="text-red-700 text-sm"
           *ngIf="form.get('medio')?.touched && form.get('medio')?.hasError('required')">
          O campo de perguntas médio é obrigatório.
        </p>
      </div>

      <div class="flex w-1/4 flex-col text-xs ml-2">
        <label class="mb-1">Difíceis:</label>
        <p-inputNumber
          formControlName="dificil"
          class="inline-grid"
          locale="pt-BR"/>
        <p class="text-red-700 text-sm"
           *ngIf="form.get('dificil')?.touched && form.get('dificil')?.hasError('required')">
          O campo de perguntas difíceis é obrigatório.
        </p>
      </div>
    </div>
    <button
      pButton
      label="Gerar Prova"
      class="mt-4"
      [disabled]="!valido"
      (click)="gerarProvaPdf()"
    ></button>
    <div class="mt-3">
      <p [ngClass]="{ 'text-green-600': restante === 0, 'text-red-600': restante !== 0 }">
        Restante: {{ restante }}
      </p>
    </div>
  </form>

<iframe *ngIf="pdfUrl" [src]="pdfUrl" width="100%" height="600px"></iframe>
</p-panel>


<p-panel header="Prova" class="text-center sm:text-left" *ngIf="provaVisible">
</p-panel>
