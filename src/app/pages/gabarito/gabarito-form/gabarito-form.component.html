<p-toast/>
<div class="p-fluid p-formgrid p-grid">
  <div class="p-field col-12">

    <p-fileUpload #fileUpload class="file-upload-custom space-x-4" name="Carregar Arquivos"
                  url="https://www.primefaces.org/cdn/api/upload.php" (onUpload)="onSelecionarArquivo($event)" [multiple]="false"
                  accept="image/*,application/pdf,application/msword,application/xml,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                  chooseLabel="Arquivos" uploadLabel="Enviar" cancelLabel="Cancelar">
    </p-fileUpload>
  </div>

  <div class="p-field col-12" *ngIf="imagemPreview">
    <p>Pré-visualização:</p>
    <img [src]="imagemPreview" alt="Imagem selecionada" style="max-width: 100%; max-height: 400px;">
  </div>

  <div class="p-field col-12">
    <button pButton label="Corrigir Gabarito" icon="pi pi-check" (click)="corrigir()" [disabled]="!arquivoSelecionado"></button>
  </div>
</div>

<div *ngIf="resultado" class="p-mt-4">
  <h3>Resultado</h3>
  <p>Aluno: {{resultado.aluno }}</p>
  <p>Certas: {{ resultado.certas }}</p>
  <p>Erradas: {{ resultado.erradas }}</p>
  <p>Total: {{ resultado.total }}</p>

  <p-table
    [value]="resultado.detalhesOrdenados"
    [paginator]="true"
    [rows]="10"
    responsiveLayout="scroll"
    class="mt-3"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>#</th>
        <th>Resposta</th>
        <th>Status</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-detalhe let-i="rowIndex">
      <tr>
        <td>{{ i + 1 }}</td>
        <td>{{ detalhe.resposta }}</td>
        <td>
          <p-tag
            [value]="detalhe.status"
            [severity]="detalhe.status === 'correta' ? 'success' : 'danger'"
          ></p-tag>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
